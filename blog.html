<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blog - FabGlow AI Solutions</title>
  <meta name="description" content="Insights, practical guides, and updates from FabGlow AI Solutions." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-light: #02030a;
      --bg-card: #080b18;
      --accent: #f72585;
      --accent-dark: #21d4fd;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --border-soft: rgba(33, 212, 253, 0.30);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(37, 99, 235, 0.20), transparent 32%),
        radial-gradient(circle at 86% 18%, rgba(247, 37, 133, 0.18), transparent 30%),
        var(--bg-light);
      color: var(--text-main);
    }
    .page-wrapper {
      max-width: 960px;
      min-height: calc(100vh - 170px);
      margin: 0 auto;
      padding: 32px 16px 80px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }
    .logo {
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 1.1rem;
      white-space: nowrap;
    }
    .logo span {
      background: linear-gradient(90deg, #21d4fd 0%, #2563eb 35%, #7c3aed 65%, #f72585 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px; }
    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    nav a:hover, nav a[aria-current="page"] { color: var(--accent-dark); }
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(37, 99, 235, 0.18), 0 0 18px rgba(247, 37, 133, 0.10);
      border: 1px solid var(--border-soft);
    }
    h1 { font-size: 1.8rem; margin: 0 0 8px; }
    .tagline { color: var(--text-muted); margin: 0 0 24px; line-height: 1.6; }
    #soro-blog { min-height: 240px; }
    footer {
      border-top: 1px solid var(--border-soft);
      padding: 20px 16px;
      background: #050713;
    }
    .footer-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .footer-links { display: flex; flex-wrap: wrap; gap: 12px; }
    .footer-links a { text-decoration: none; color: var(--text-muted); }
    .footer-links a:hover { color: var(--accent-dark); }
    @media (max-width: 640px) {
      header { align-items: flex-start; flex-direction: column; }
      nav { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header>
      <div class="logo">FabGlow <span>AI</span> Solutions</div>
      <nav aria-label="Main navigation">
        <a href="/about">About</a>
        <a href="/blog" aria-current="page">Blog</a>
        <a href="/contact">Contact</a>
        <a href="/shipping-policy">Shipping</a>
        <a href="/refund-policy">Refunds</a>
      </nav>
    </header>
    <main class="card">
      <h1>FabGlow AI Blog</h1>
      <p class="tagline">Insights, practical guides, and updates to help your business grow with AI.</p>
      <div id="soro-blog"></div>
      <script src="https://app.trysoro.com/api/embed/76e51e9a-9a77-4c14-8f28-5e0a88d88400" defer></script>
    </main>
  </div>
  <footer>
    <div class="footer-inner">
      <div>© FabGlow AI Solutions, Plainfield, NJ</div>
      <div class="footer-links">
        <a href="/about">About Us</a>
        <a href="/blog">Blog</a>
        <a href="/contact">Contact</a>
        <a href="/shipping-policy">Shipping Policy</a>
        <a href="/refund-policy">Refund Policy</a>
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms-of-service">Terms of Service</a>
      </div>
    </div>
  </footer>
</body>
</html>
